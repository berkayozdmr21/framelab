server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 client_max_body_size 5m;
 location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 60s; }
 location /health { proxy_pass http://api:8080; }
 location / { try_files $uri /index.html; }
}
