name: Verify FrameLab
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        database: [SQLite, Postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: framelab
          POSTGRES_DB: framelab
          POSTGRES_PASSWORD: ci-local-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U framelab"
          --health-interval 5s --health-retries 20
    env:
      ASPNETCORE_ENVIRONMENT: Development
      DatabaseProvider: ${{ matrix.database }}
      ConnectionStrings__Default: Host=localhost;Database=framelab;Username=framelab;Password=ci-local-only-password
      ASPNETCORE_URLS: http://127.0.0.1:9261
      DataPath: ${{ github.workspace }}/.runtime/ci
      MediaPath: ${{ github.workspace }}/.runtime/ci/media
      FontPath: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: npm ci
      - run: npm run build
      - run: dotnet build src/FrameLab.Api -c Release && dotnet build src/FrameLab.Worker -c Release
      - name: Start API and independent worker
        run: |
          mkdir -p .runtime/logs
          dotnet src/FrameLab.Api/bin/Release/net10.0/FrameLab.Api.dll > .runtime/logs/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:9261/health && break; sleep 1; done
          dotnet src/FrameLab.Worker/bin/Release/net10.0/FrameLab.Worker.dll > .runtime/logs/worker.log 2>&1 &
          npm run dev > .runtime/logs/web.log 2>&1 &
      - run: npm test
      - name: Verify encoded media streams
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration -of json .runtime/test-results/render.mp4
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostic-logs
          path: |
            .runtime/logs
            test-results
